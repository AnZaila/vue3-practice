name: 部署到 GitHub Pages

on:
  push:
    branches: ["main"]  # 监听 main 分支的推送

# 设置 GITHUB_TOKEN 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 避免多个任务同时部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install

      - name: 构建项目
        run: pnpm build

      - name: 配置 Pages
        uses: actions/configure-pages@v4

      - name: 上传构建产物 (dist 目录)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'  # ✅ 关键：上传你的 dist 目录

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4